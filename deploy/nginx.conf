# nginx server block for bakumon.net.
#
# Expands the three-line snippet in ground-truth/06-deployment/runbook.md into the file
# that actually gets installed, and closes pre-production.md item 36 (no security headers,
# no gzip for application/json, no limit_req).
#
# Install to /etc/nginx/sites-available/bakumon, symlink into sites-enabled, then
# `nginx -t && systemctl reload nginx`. Certbot rewrites the listen/ssl lines in place on
# its first run; everything below the TLS block is what this file is really for.

# Two zones, not one. The API and the site have completely different traffic shapes, and a
# shared zone means a crawler walking 1,844 sitemap URLs can exhaust the budget that real
# API calls need. 10m holds roughly 160k addresses.
limit_req_zone $binary_remote_addr zone=bakumon_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=bakumon_site:10m rate=60r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bakumon.net www.bakumon.net;
    # Certbot replaces this with its own redirect and the :443 block.
    return 301 https://bakumon.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bakumon.net;

    root /var/www/bakumon/apps/web/dist;
    index index.html;

    # ssl_certificate / ssl_certificate_key are written here by Certbot.

    # The site is one origin serving its own static files and calling its own /api. It
    # embeds nothing and is embedded nowhere, so these can be strict.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No camera, microphone or geolocation is used anywhere on this site (ADR 0007 also
    # rules out analytics), so every powerful feature is denied outright.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    # HSTS is deliberately not preloaded. Preloading is effectively irreversible and needs
    # every future subdomain to be HTTPS; add `preload` only once that is certain.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 'unsafe-inline' for style-src is required by the inline theme script's counterpart in
    # index.html and by React's inline style attributes. script-src stays without it: the
    # one inline script is the pre-paint theme setter, which carries its own nonce below if
    # it is ever tightened further.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # application/json is the one that matters here and is NOT in nginx's default list -
    # every wiki page is driven by JSON responses that were shipping uncompressed.
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Everything under /assets is content-addressed by filename and never changes in place,
    # so it can be cached hard. Without this block every image on the site 404s - the files
    # are not in the SPA build and are not in git.
    location /assets/ {
        alias /var/www/bakumon/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        limit_req zone=bakumon_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API sets `trust proxy` to 1 - exactly one hop. Putting a CDN in front of this
        # without changing that number makes every visitor behind it share one rate-limit
        # bucket. Setting it to `true` instead would let any client forge X-Forwarded-For
        # and mint itself a fresh bucket per request.
        proxy_read_timeout 30s;
    }

    # Hashed build output: the filename changes whenever the contents do.
    location /assets/index- {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sitemap.xml { expires 1d; }
    location = /robots.txt  { expires 1d; }

    # Defence in depth behind the explicit `root` above. If that root is ever pointed at
    # the checkout instead of the build output, `GET /.env` would return DATABASE_URL in
    # plaintext; this denies every dotfile regardless. Two independent controls, because
    # the one that fails is the one nobody re-checked.
    #
    # Note the root is /var/www/bakumon/apps/web/dist, NOT /var/www/bakumon/dist - `npm run
    # web:build` writes inside the workspace. pre-production.md item 36 said the latter;
    # that path does not exist and nginx would fail to serve anything from it.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        limit_req zone=bakumon_site burst=120 nodelay;
        # Client-side routing (ADR 0008): a deep link like /wiki/pokemon/magikarp is not a
        # file on disk, and without this it 404s before React ever loads.
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a deploy ships new hashed bundles that
    # nobody's browser asks for.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
