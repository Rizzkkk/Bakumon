# Bootstrap server block: HTTP only, used ONCE to obtain the first certificate.
#
# This exists because of an ordering trap. The real config (deploy/nginx.conf) has a
# `listen 443 ssl` block, and nginx refuses to start when that names a certificate file
# that does not exist yet - but certbot cannot obtain a certificate until nginx is serving
# port 80 for the HTTP-01 challenge. Installing the real config first is a deadlock.
#
# So: install this, get the certificate, then replace it with deploy/nginx.conf.
#
#   cp deploy/nginx-bootstrap.conf /etc/nginx/sites-available/bakumon
#   ln -s /etc/nginx/sites-available/bakumon /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d bakumon.net -d www.bakumon.net
#   cp deploy/nginx.conf /etc/nginx/sites-available/bakumon
#   nginx -t && systemctl reload nginx
#
# Deliberately no `default_server`. This box already has a 000-catchall block holding that
# role, and two default_server blocks on the same port is a startup error that would take
# every other site on the machine down with it.

server {
    listen 80;
    listen [::]:80;
    server_name bakumon.net www.bakumon.net;

    root /var/www/bakumon/apps/web/dist;
    index index.html;

    # Certbot writes its challenge files under here. No redirect to HTTPS in this file -
    # that would bounce the challenge request before it could be answered.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
