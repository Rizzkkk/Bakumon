<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />

    <!-- Generated by `npm run brand` from assets/brand/logo-transparent.png, nearest
         neighbour because the mark is pixel art. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <title>Bakumon Wiki</title>
    <meta name="description" content="A community wiki for the Bakumon Minecraft server: Pokemon spawn data and item reference for Cobblemon." />

    <!--
      Site-wide only, and that is the honest ceiling. Social scrapers do not run
      JavaScript, so a client-rendered SPA cannot serve per-route og: tags - every link
      would unfurl as whatever the shell says regardless. Shipping per-page og: tags here
      would be markup that nothing ever reads. ADR 0008. Per-page <title> is different and
      does work; it is set by usePageTitle inside an effect.

      og:image is root-relative. Discord and most scrapers resolve that against the page
      URL, but the specification asks for an absolute one - set og:url and make this
      absolute once the real domain is known. 06-deployment/runbook.md.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bakumon" />
    <meta property="og:title" content="Bakumon Wiki" />
    <meta property="og:description" content="Pokemon spawn data and item reference for the Bakumon Cobblemon server." />
    <meta property="og:image" content="/assets/brand/banner-1280.webp" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
