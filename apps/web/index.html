<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5EFE3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101115" media="(prefers-color-scheme: dark)" />

    <!-- Sets data-theme before first paint so there is no flash of the wrong theme. Mirrors
         useTheme.js: stored choice wins, otherwise the system setting. -->
    <script>
      try {
        var t = localStorage.getItem('bakumon-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>

    <!-- Generated by `npm run brand` from assets/brand/logo-transparent.png, nearest
         neighbour because the mark is pixel art. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/baloo-2-latin-400-800.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/atkinson-hyperlegible-latin-400.woff2" crossorigin />

    <title>Bakumon Wiki</title>
    <meta name="description" content="A community wiki for the Bakumon Minecraft server: Pokemon spawn data and item reference for Cobblemon." />

    <!--
      The og: tags below are site-wide, and that is the honest ceiling for them. Social
      scrapers do not run JavaScript, so a client-rendered SPA cannot serve per-route og:
      tags - every link unfurls as whatever this shell says regardless. Shipping per-page
      og: tags here would be markup nothing ever reads. ADR 0008.

      The line is not "per-route head tags are impossible", though, because Google DOES
      render JavaScript. Split precisely:

        Read by Google, set per route in hooks/useHead.js - <title>, <meta name=
        "description">, <link rel="canonical">, and the JSON-LD blocks.

        Read by scrapers, frozen here for every URL - everything og:.

      The description below is therefore a fallback in two senses: it is what a scraper
      always sees, and it is what a reader sees for the instant before the route's own
      description replaces it.

      og:url and og:image are absolute, which is what the Open Graph specification asks
      for. They are hardcoded rather than read from VITE_SITE_URL because this file is not
      processed by the bundler's env substitution - if the domain ever changes, these two
      lines change with apps/web/.env. 06-deployment/runbook.md.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bakumon" />
    <meta property="og:url" content="https://bakumon.net/" />
    <meta property="og:title" content="Bakumon - Friendly Cobblemon Minecraft Server" />
    <meta property="og:description" content="A safe, friendly Cobblemon Minecraft server. Claim your land, keep what you build, and look up every Pokemon spawn and item." />
    <meta property="og:image" content="https://bakumon.net/assets/brand/banner-1280.webp" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
